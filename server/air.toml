root = "." # root directory of the project
tmp_dir = "tmp" # temporary directory wher air will store its temorary files

[build] # The build configuration
bin = "main" # The name of the binary file to be generated after building the project
cmd = "go build -o {{.Output}} {{.Input}}" # Command to build the project
exclude = ["tmp/*", "client/*"] # directories to be excluded from monitoriing for changes
include = ["**/*.go"] # files to be included for monitoring
ignore = ["tmp/*"] # ignore when triggering a build